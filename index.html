<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GuaraClub – Login</title>
  <link rel="icon" type="image/png" href="images/logo_guararedondo-circular.png">
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <div class="login">
    <div class="hero">
      <div class="sign">
        <img src="images/logo_guara.jpg" alt="GuaraClub — comunidade Tech Brazil">
      </div>
    </div>
    <div class="panel">
      <div class="logo">
        <img src="images/logo_guararedondo.jpeg" alt="Logo GuaraClub">
      </div>
      <h2>Bem-vindo de volta</h2>
      <form action="pages/home.html">
        <label for="email">E-mail</label>
        <input class="f" id="email" type="email" autocomplete="email" placeholder="Ex: emilyhelena@gmail.com" required>
        <label for="password">Senha</label>
        <input class="f" id="password" type="password" autocomplete="current-password" placeholder="********" required>
        <button type="submit" class="go">ENTRAR</button>
      </form>
      <a class="alt" href="pages/cadastro.html">Não tem uma conta? Crie sua conta</a>
      <div class="cp">
        © 2026 Devan. Todos os direitos reservados.<br>Developed by Devan
      </div>
    </div>
  </div>
</body>
</html>
